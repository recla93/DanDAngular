<div class="rain"></div>
  <div class="select-bg">
    <div class="header-controls">
      <a routerLink="/" class="game-button back-button">
        <span class="arrow">&lt;</span> HOME
      </a>
      <h2 class="title page-main-title">SELEZIONE PERSONAGGI</h2>
    </div>
    <div class="container py-4 content-container">

    <p class="selection-info">Seleziona 3 developers: {{ selectedNames }}</p>

    <div class="row g-3 justify-content-center character-grid">
      <div class="col-12 col-sm-6 col-md-4 d-flex" *ngFor="let character of allCharacters">
        <div class="card character-card shadow"
             [class.selected-card]="idSelectedCharacter.includes(character.id)"
             (click)="selectionChange(character.id)">

          <div class="card-image-container">
            <img [src]="character.imageUrl || 'https://placehold.co/300x400/000000/0f0?text=' + character.name"
                 class="card-img-top"
                 [alt]="character.name"
                 onerror="this.onerror=null; this.src='https://placehold.co/300x400/000000/0f0?text=Image+Not+Found';">
          </div>

          <div class="card-info-overlay">
            <h5 class="card-title-overlay">{{ character.name }}</h5>
            <ul class="character-stats-list-overlay">
              <li><span>❤️ HP</span><span>{{ character.hp || 'N/D' }}</span></li>
              <li><span>⚔️ ATK</span><span>{{ character.atk || 'N/D' }}</span></li>
              <li><span>🛡️ DEF</span><span>{{ character.def || 'N/D' }}</span></li>
              <li><span>💨 SPD</span><span>{{ character.spd || 'N/D' }}</span></li>
            </ul>
          </div>

        </div>
      </div>
    </div>
  </div>
</div>
